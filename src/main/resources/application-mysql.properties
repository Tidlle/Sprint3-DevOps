spring.application.name=clyvo-vitalpet
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/vitalpetdb}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:vitalpet}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/{vendor}
spring.flyway.baseline-on-migrate=true

spring.h2.console.enabled=false

spring.cache.type=simple
spring.cache.cache-names=clinicas,tutores,pets,veterinarios,consultas,alertas,acompanhamentos,dashboard

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
