<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>VitalPet - Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main style="max-width: 380px; margin-top: 4rem;">
    <div class="card">
        <h1>VitalPet</h1>
        <p style="color:#5b6b62; margin-top: -0.5rem;">Continuidade do cuidado veterinário</p>

        <p class="alerta-flash erro" th:if="${erro}">E-mail ou senha inválidos.</p>
        <p class="alerta-flash sucesso" th:if="${logout}">Você saiu do sistema.</p>

        <form th:action="@{/web/login}" method="post">
            <div class="campo">
                <label for="username">E-mail</label>
                <input type="email" id="username" name="username" required autofocus>
            </div>
            <div class="campo">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Entrar</button>
        </form>
    </div>
</main>
</body>
</html>
